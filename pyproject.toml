[project]
name = "handwritten-digits"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pierre Mazard", email = "pierre.mazard@laplateforme.io" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
]

[project.scripts]
handwritten-digits = "handwritten_digits:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.5",
]
